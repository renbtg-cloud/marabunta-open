# Marabunta - Licensed under the MIT License.
# cargo-deny configuration for EU highestsec compliance (L-1)
# https://embarkstudios.github.io/cargo-deny/

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "OpenSSL",
]

[bans]
multiple-versions = "warn"
