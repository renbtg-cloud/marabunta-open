# Marabunta - Licensed under the MIT License.
[workspace]
members = [".", "sdk/plugin", "sdk/plugin-macros"]

[package]
name = "marabunta-compute"
version = "0.1.0"
edition = "2021"
description = "Low-Budget Massive Parallel Computing framework - distributed computing for everyone"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marabunta-compute/marabunta-compute"
homepage = "https://marabunta-compute.io"
documentation = "https://docs.marabunta-compute.io"
readme = "README.md"
keywords = ["distributed", "computing", "parallel", "cluster", "hpc"]
categories = ["concurrency", "network-programming", "command-line-utilities"]
authors = ["Marabunta Compute Contributors"]
rust-version = "1.75"
exclude = [
    "docker/",
    "packaging/",
    ".github/",
    "docs/",
    "*.md",
    "*.pdf",
]

[dependencies]
tar = "0.4"

cap-std = "3.2"

md-5 = "0.10.6"
anyhow = "1.0"
evalexpr = "11"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_yaml = "0.9"
rhai = "1.19"
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tower-lsp = "0.20"
dap = "0.4.1-alpha1"
uuid = { version = "1.6", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5.5"
futures = "0.3"
tokio-tungstenite = "0.21"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
bytes = "1.5"
rand = "0.8"
async-trait = "0.1"
parking_lot = "0.12"
num_cpus = "1.16"
sysinfo = "0.30"
sha2 = "0.10"
sha3 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
csv = "1.3"
semver = { version = "1.0", features = ["serde"] }
toml = "0.8"
humantime = "2.1"
humantime-serde = "1.1"
directories = "5.0"
tokio-util = { version = "0.7", features = ["codec"] }
strum = "0.26"
strum_macros = "0.26"
base64 = "0.22"
once_cell = "1.19"
regex = "1.10"
wat = "1.0"

# CLI dependencies
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }
dirs = "5"
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"

# TUI dependencies
ratatui = "0.28"
crossterm = "0.28"
tui-input = "0.10"

# Phantom Protocol cryptographic dependencies
num-bigint = { version = "0.4", features = ["rand"] }
num-integer = "0.1"
num-traits = "0.2"
zeroize = { version = "1.7", features = ["derive"] }

# Marabunta Protocol - Post-quantum cryptographic dependencies
ml-kem = "0.2"
kem = "=0.3.0-pre.0"
fips204 = "0.4"
aes-gcm = "0.10"
hkdf = "0.12"
chacha20 = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Neuromancer subsystem
blake3 = "1"
reed-solomon-erasure = "6"
hex = "0.4"

# Highestsec sandbox (Wasmtime WASM executor)
wasmtime = { version = "19" }
wasmtime-wasi = "19"

# eBPF support


# Highestsec compliance - Argon2id KDF
argon2 = "0.5"

# Highestsec compliance - seccomp-BPF (Linux only, optional)
seccompiler = { version = "0.4", optional = true }

# Blind computation security
scopeguard = "1.2"
subtle = "2.5"
risc0-zkvm = { version = "1.0", features = ["std"] }
# Uncomment below for GPU acceleration on NVIDIA machines
# risc0-zkvm = { version = "1.0", features = ["std", "cuda"] }

# PostgreSQL subsystem (swarm-managed)
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
deadpool-postgres = "0.14"
postgres-types = { version = "0.2", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
arc-swap = "1"

# Compression algorithms
flate2 = "1.0"
zstd = "0.13"
lz4_flex = "0.11"

# TLS and security
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.1"
tokio-rustls = "0.26"

# Dashboard embedding
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"

# DAG support for task dependencies
petgraph = "0.6"

# Prometheus metrics
prometheus = "0.13"
lazy_static = "1.4"

# Hostname detection for tracing
hostname = "0.4"

# High-performance serialization for checkpoints
bincode = "1.3"
pgwire = "0.30.2"
sqlparser = "0.43"
git2 = "0.20.4"
gimli = "0.32.3"
object = "0.39.0"
addr2line = "0.24.2"
getrandom = { version = "0.3.4", features = ["std"] }
moka = { version = "0.12.15", features = ["sync", "future"] }
bls12_381 = "0.8.0"
ff = "0.13"
group = "0.13.0"
pqcrypto-kyber = "0.8.1"
pqcrypto-traits = "0.3.5"
rand_core = "0.9.5"
webrtc = "0.17.1"
stun = "0.17.1"
tokio-stream = "0.1.18"
chacha20poly1305 = "0.10.1"
quinn = "0.11.9"
rcgen = "0.14.7"
tract-onnx = "0.21"
serde-big-array = "0.5.1"
candle-core = "0.10.2"
hcl-rs = "0.19.7"

# CPU affinity support (Unix-only)
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.28", features = ["ptrace", "process", "signal"] }

[features]
default = ["placement-integration"]
# Enable integration between policy and placement modules
placement-integration = []
# Enable real Wasmtime WASM sandbox (highestsec compliance)
highestsec-sandbox = ["dep:seccompiler"]
# Enable Windows Service support (requires Windows)
windows-service = ["dep:windows-service"]
# Enable runtime file reading for dashboard hot reload during development
dashboard-dev = ["rust-embed/debug-embed"]
# Compliance profiles (build-time enforcement)
compliance-soc2 = []
compliance-hipaa = []
compliance-gdpr = []
compliance-fedramp = []
compliance-highestsec = []

[build-dependencies]
toml = "0.8"
cc = "1.0"


[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }
rand_distr = "0.4"
wat = "1.0"

[[bench]]
name = "compression_bench"
harness = false

[lib]
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

# Android JNI dependencies (only for Android builds)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.13"

# Windows-specific dependencies (only for Windows builds)
[target.'cfg(target_os = "windows")'.dependencies]
windows-service = { version = "0.7", optional = true }











[[bin]]
name = "marabunta-swarm"
path = "src/bin/swarm.rs"

[[bin]]
name = "marabunta-swarm-service"
path = "src/bin/swarm_service_windows.rs"
required-features = ["windows-service"]

[[bin]]
name = "swarmctl"
path = "src/bin/swarmctl.rs"



[[bin]]
name = "marabunta-sign"
path = "src/bin/marabunta-sign.rs"

[[bin]]
name = "marabunta-cli"
path = "src/bin/marabunta_cli.rs"

# Release profile optimizations for smaller, faster binaries
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Profile for development releases (faster compilation, some optimizations)
[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "none"

# Profile for maximum size reduction
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# ============================================================================
# Examples
# ============================================================================

[[example]]
name = "monte_carlo_pi"
path = "examples/monte_carlo_pi.rs"

[[example]]
name = "word_count"
path = "examples/word_count.rs"

[[example]]
name = "parameter_sweep"
path = "examples/parameter_sweep.rs"

[[example]]
name = "workflow_etl"
path = "examples/workflow_etl.rs"

[[example]]
name = "checkpointed_simulation"
path = "examples/checkpointed_simulation.rs"

[[example]]
name = "multi_tenant"
path = "examples/multi_tenant.rs"
[[bin]]
name = "symbiont-scanner"
path = "src/bin/symbiont_scanner.rs"
[[bin]]
name = "marabunta-dev"
path = "src/bin/marabunta_dev_swarm.rs"

[[bin]]
name = "marabunta-lsp"
path = "src/bin/marabunta_lsp.rs"

[[bin]]
name = "marabunta-dap"
path = "src/bin/marabunta_dap.rs"

[[bin]]
name = "marabunta-resonance"
path = "src/bin/marabunta_resonance.rs"

[[bin]]
name = "marabunta-visor"
path = "src/bin/marabunta_visor.rs"






