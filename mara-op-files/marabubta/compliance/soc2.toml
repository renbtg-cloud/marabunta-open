# SOC2 Compliance Profile
# Locks settings required for SOC 2 Type II certification.

[profile]
name = "soc2"
version = "1.0"
description = "SOC 2 Type II — security, availability, processing integrity"

[[overrides]]
key = "security.api_auth_required"
value = true
ui_visibility = "visible_readonly"
constraint_type = "exact"
justification = "SOC2 CC6.1: Logical access controls must be enforced"

[[overrides]]
key = "security.auth_token_expiry"
value = "86400s"
ui_visibility = "visible_readonly"
constraint_type = "max"
justification = "SOC2 CC6.1: Token expiry must not exceed 24 hours"

[[overrides]]
key = "management.audit_max_entries"
value = 1000000
ui_visibility = "visible_readonly"
constraint_type = "min"
justification = "SOC2 CC7.2: Audit log must retain at least 1M entries"

[[overrides]]
key = "verification.default_replicas"
value = 2
ui_visibility = "visible_readonly"
constraint_type = "min"
justification = "SOC2 CC8.1: Verification replicas minimum 2 for data integrity"

[[overrides]]
key = "neuromancer.enabled"
value = true
ui_visibility = "visible_readonly"
constraint_type = "exact"
justification = "SOC2 CC6.6: Anomaly detection must be active"
