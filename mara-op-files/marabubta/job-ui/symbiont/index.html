<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marabunta Symbiont - Global Workspace Scanner</title>
    <style>
        body { font-family: monospace; background: #fff; color: #000; padding: 40px; margin: 0; }
        h1 { background: #000; color: #fff; padding: 20px; font-size: 40px; text-transform: uppercase; letter-spacing: -2px; margin-top: 0; }
        h2 { border-bottom: 6px solid #000; font-size: 30px; text-transform: uppercase; }
        .box { border: 6px solid #000; padding: 20px; margin-bottom: 30px; box-shadow: 12px 12px 0px #000; }
        .code-snippet { background: #000; color: #0f0; padding: 15px; font-weight: bold; white-space: pre-wrap; margin: 15px 0; border: 4px solid #333; }
        .btn { background: #ff0000; color: #fff; border: 4px solid #000; padding: 15px 30px; font-weight: bold; font-size: 18px; cursor: pointer; text-transform: uppercase; box-shadow: 6px 6px 0px #888; display: inline-block; text-decoration: none; }
        .btn:hover { background: #000; color: #ff0000; }
        .stats { display: flex; gap: 40px; margin-bottom: 40px; font-size: 24px; font-weight: bold; }
        .stat-box { background: #e0e0e0; padding: 20px; border: 4px solid #000; }
        .tag { background: #000; color: #fff; padding: 5px 10px; display: inline-block; font-size: 14px; margin-right: 10px; }
    </style>
</head>
<body>

    <h1>MARABUNTA SYMBIONT: WORKSPACE DASHBOARD</h1>
    
    <div class="stats">
        <div class="stat-box">FILES SCANNED: <span id="files-scanned">Loading...</span></div>
        <div class="stat-box" style="background:#ffff00;">HIDDEN GEMS FOUND: <span id="gems-found">Loading...</span></div>
    </div>

    <h2>PARALLELIZATION OPPORTUNITIES</h2>
    
    <div id="results">
        <p>Run the Symbiont Scanner CLI to generate the report...</p>
    </div>

    <script>
        // Fetch the generated JSON report and render it
        fetch('../../symbiont_report.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('files-scanned').innerText = data.scanned_files;
                document.getElementById('gems-found').innerText = data.opportunities_found;
                
                let html = '';
                data.opportunities.forEach(opp => {
                    html += `
                    <div class="box">
                        <div style="margin-bottom: 15px;">
                            <span class="tag">${opp.language}</span>
                            <span class="tag" style="background:#ff0000;">${opp.heuristic_triggered}</span>
                            <span class="tag" style="background:#0000ff;">CONFIDENCE: ${opp.confidence_score}%</span>
                        </div>
                        <h3>FILE: ${opp.file}:${opp.line_number}</h3>
                        <p>${opp.description}</p>
                        <div class="code-snippet">${opp.snippet}</div>
                        <button class="btn" onclick="alert('Sending AST to Marabunta for Auto-Refactor...')">⚡ AUTO-REFACTOR TO SWARM</button>
                    </div>
                    `;
                });
                
                if(data.opportunities_found === 0) {
                    html = '<p>No opportunities found. Your code is perfectly asynchronous!</p>';
                }
                
                document.getElementById('results').innerHTML = html;
            })
            .catch(err => {
                console.warn("Could not load report automatically. Please run the scanner CLI first.");
            });
    </script>
</body>
</html>
