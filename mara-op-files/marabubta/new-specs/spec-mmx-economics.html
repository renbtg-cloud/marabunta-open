        <h2>Book V: The MMX Spot Market & Energy Oracle</h2>
        <h3>The Architecture of Universal FinOps</h3>
        
        <p>
            Cloud providers (AWS, Azure, GCP) sell compute via artificial, time-based abstractions (vCPUs per hour). This model is a financial obfuscation layer designed to capture massive margins. Marabunta shatters this paradigm by pricing compute down to the physical <strong>Joule</strong>—the literal energy required to execute WebAssembly opcodes on silicon.
        </p>

        <p>
            The <strong>MMX Spot Market</strong> is a decentralized, auction-based exchange where computation tasks hunt for the cheapest available power across the planet.
        </p>

        <h3>5.1 The Energy Oracle & Fuel Metering</h3>
        <p>
            Every node in the Swarm runs an <code>Energy Oracle</code> (located in <code>src/swarm/energy.rs</code>). This subsystem maps WASM instruction execution directly to hardware-specific power consumption. It accounts for the idle vs. load wattage of specific architectures (ARM vs. x86_64) and even GPU-specific draw.
        </p>

        <div class="alert">
            <strong>HIERARCHICAL OVERRIDES:</strong> Node operators can set precise power profiles at the node, node-type, or group level. If a data center in Iceland has access to $0.02/kWh geothermal energy, its Oracle will outbid a residential node in London paying $0.40/kWh, naturally attracting the heaviest computational workloads to the cheapest physical energy sources.
        </div>

        <h3>5.2 The Marketplace Lifecycle: Bidding & Awards</h3>
        <p>
            When a user submits a job, the <code>MarketplaceEngine</code> posts a <code>JobPosting</code> to the DHT. This posting is not "scheduled" by a central server; it propagates via epidemic gossip.
        </p>

        <ol>
            <li><strong>The Posting:</strong> Submitter posts a JCL Bid with a maximum budget in MMX Tokens.</li>
            <li><strong>The Gossip:</strong> The posting spreads globally. Every node evaluates the job's <code>JobRequirements</code> against its own local Energy Oracle cost.</li>
            <li><strong>The Bid:</strong> Capable nodes submit a cryptographic <code>Bid</code> to the DHT.</li>
            <li><strong>Deterministic Award:</strong> After a 5-second <code>BID_WINDOW</code>, all nodes independently run the <code>select_winner</code> algorithm. Because the scoring is deterministic and tie-breaking is lexicographic, every node in the cluster arrives at the same winner without any central arbitration.</li>
        </ol>
