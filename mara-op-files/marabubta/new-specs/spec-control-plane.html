        <h2>Book IX: The Control Plane & 3D Telemetry</h2>
        <h3>The Architecture of High-Authority Observability</h3>
        
        <p>
            Observing a 100-million node superorganism requires moving beyond flat metrics and standard 2D dashboards. Marabunta's <strong>Control Plane</strong> (located in <code>src/control_plane/</code>) provides a high-authority, real-time command surface that visualizes the planetary mesh as a multi-dimensional topological organism.
        </p>

        <h3>9.1 The 3D Observatory (Three.js Engine)</h3>
        <p>
            The Marabunta Dashboard utilizes a custom Three.js engine (<code>dashboard/src/three/</code>) to visualize the DHT in real-time. Instead of a list of servers, operators interact with a live 3D force-directed graph.
        </p>

        <div class="alert">
            <strong>CLUSTERING ALGORITHMS:</strong> The Observatory supports multiple layout engines to surface hidden architectural bottlenecks. The <code>SpectralLayout</code> visualizes node connectivity clusters, while the <code>GeographicLayout</code> projects the Swarm onto a 3D terrestrial globe, highlighting physical fiber-cut vulnerabilities and regional data center hotspots.
        </div>

        <h3>9.2 Real-Time Telemetry Firehose (WebSocket API)</h3>
        <p>
            Standard polling (HTTP GET) is too slow for a 100-million node swarm. The Control Plane exposes a <strong>Binary Telemetry Firehose</strong> via WebSockets. This firehose streams live events, MMX spot price shifts, and thermal/memory telemetry directly into the dashboard and IDE Symbionts with sub-50ms latency.
        </p>

        <pre><code>// src/control_plane/websocket.rs - High-Velocity Telemetry
pub async fn broadcast_telemetry(bus: Arc<SwarmBus>, sockets: &WebSocketPool) {
    while let Some(event) = bus.recv().await {
        // Serialize to highly compressed binary format (FlatBuffers)
        let payload = compress_event(&event);
        sockets.send_all(payload).await;
    }
}</code></pre>

        </p>

        <h3>9.4 The Topological Kill Switch</h3>
        <p>
            In the event of a global coordinated attack or a runaway recursive compute loop, the Control Plane provides the <strong>Topological Kill Switch</strong>. Signed by the Operator's Super-Peer key, this command broadcasts a BGP-style route blackhole via the gossip network, instantaneously quarantining entire subnets or halting all execution across specific geographic sectors without requiring access to the physical node hardware.
        </p>
