        <h2>Book VII: WAN Traversal & Hyperscale Topology</h2>
        <h3>The Architecture of Global Connectivity</h3>
        
        <p>
            Operating a 100-million node superorganism across the open internet requires overcoming two massive physical hurdles: <strong>Carrier-Grade NATs (CGNAT)</strong> that block inbound connections, and <strong>Extreme Latency</strong> in disconnected or orbital environments (Satellites, Submarines, Battlefield Edge).
        </p>

        <p>
            Marabunta solves these via a combination of a high-performance WAN Switchboard and a proprietary Stigmergic Delay-Tolerant Network (DTN).
        </p>

        <h3>7.1 The WAN Switchboard & NAT Piercing</h3>
        <p>
            Most edge nodes (home PCs, IoT sensors) sit behind restrictive firewalls. Marabunta's <code>WAN Bootstrap Server</code> (located in <code>src/wan/</code>) enables planetary-scale discovery without requiring manual port forwarding.
        </p>

        <div class="alert">
            <strong>DUAL-PORT STUN:</strong> The Bootstrap Server operates on TCP (9000) for reliable PKI registration and UDP (9001) for high-speed STUN-style discovery. This allows nodes to autonomously pierce their local NATs and establish direct, peer-to-peer (P2P) Phantom Protocol tunnels for the gossip network.
        </div>

        <pre><code>// src/wan/bootstrap_server.rs - STUN Discovery Logic
pub async fn handle_discovery(socket: &UdpSocket) {
    let mut buf = [0u8; 1024];
    let (len, addr) = socket.recv_from(&mut buf).await?;
    
    // Extract Public IP and Port (Pillar 9.2)
    let peer_info = PeerDiscovery {
        public_addr: addr,
        node_id: extract_id(&buf[..len]),
    };
    
    // Broadcast peer to the topological neighborhood
    gossip_peer_presence(peer_info).await;
}</code></pre>

        <h3>7.2 Stigmergic (Async) DTN: The Dead-Drop Pattern</h3>
        <p>
            Traditional distributed computing (like Kubernetes) assumes a persistent socket. You cannot run a cluster on a satellite that only has a 4-minute line-of-sight window every 90 minutes. 
        </p>
        <p>
            Marabunta's <strong>Stigmergic DTN</strong> (<code>src/swarm/transport/stigmergic_dtn.rs</code>) bypasses live sockets. When a target node is unreachable, the sender "dead-drops" the cryptographically wrapped WASM payload into the localized Kademlia <code>BlobStore</code>. 
        </p>

        <div class="alert alert-critical">
            <strong>ORBITAL RESILIENCE:</strong> When the satellite or mobile edge node reconnects to any part of the DHT, it autonomously "pulls" the pending dead-drops, executes the WASM enclave locally, and drops the signed ZKP result back into the DHT for the original requester to retrieve later. This enables absolute, zero-packet-loss execution in extreme, disconnected environments.
        </div>

        <h3>7.3 Planetary-Scale Hierarchical Topology</h3>
        <p>
            Scaling to 100 million nodes requires a hierarchical approach. Marabunta partitions the global swarm into regional <strong>Sectors</strong> and <strong>Troops</strong>. 
        </p>

        <p>
            This multi-layer architecture ensures that a local fiber-cut in North America does not stall computation in Asia. The Swarm simply reroutes state transitions asynchronously via the surviving planetary links, reaching global eventual consistency in milliseconds once the partition heals.
        </p>
